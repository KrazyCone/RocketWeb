name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      openrocket_version:
        description: "Pin an OpenRocket release (e.g. 24.12). Leave empty for the latest release."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: firebase-hosting-live
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Catches a mangled or empty secret here, with a readable message,
      # instead of as a confusing "Failed to authenticate" during the deploy.
      - name: Validate the Firebase service account
        id: firebase
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          node --input-type=module -e '
            import fs from "node:fs";

            const fail = (message) => {
              console.error(`::error::${message}`);
              process.exit(1);
            };

            const raw = (process.env.SERVICE_ACCOUNT ?? "").trim();
            if (!raw) {
              fail("Repository secret FIREBASE_SERVICE_ACCOUNT is empty. Add the service-account key JSON under Settings > Secrets and variables > Actions.");
            }

            // Accept the raw key JSON or its base64 form, which survives copy/paste intact.
            const isJson = raw.startsWith("{");
            const text = isJson ? raw : Buffer.from(raw.replace(/\s+/g, ""), "base64").toString("utf8");

            let key;
            try {
              key = JSON.parse(text);
            } catch (error) {
              fail(`FIREBASE_SERVICE_ACCOUNT is not valid JSON (${raw.length} characters stored, ${isJson ? "read as JSON" : "read as base64"}): ${error.message}. Download a fresh key JSON from Google Cloud > IAM & Admin > Service Accounts > Keys, then run: gh secret set FIREBASE_SERVICE_ACCOUNT < key.json`);
            }

            if (key.type !== "service_account" || !key.project_id || !key.private_key) {
              fail("FIREBASE_SERVICE_ACCOUNT is valid JSON but not a service-account key: it needs type=service_account, project_id and private_key.");
            }

            const file = `${process.env.RUNNER_TEMP}/service-account.json`;
            fs.writeFileSync(file, `${JSON.stringify(key)}\n`);
            console.log(`Service account: ${key.client_email}`);
            console.log(`Key belongs to project: ${key.project_id}`);

            fs.appendFileSync(process.env.GITHUB_OUTPUT, `project_id=${key.project_id}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `credentials=${file}\n`);
          '

      - name: Download the latest official OpenRocket JAR
        env:
          # The workflow token lifts GitHub API rate limits for release lookup.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROCKET_VERSION: ${{ inputs.openrocket_version }}
        run: node scripts/fetch-openrocket.mjs

      - name: Verify the deployable output
        run: node scripts/verify-build.mjs

      - name: Add build summary
        run: |
          {
            echo "### OpenRocket Web"
            echo
            node -e '
            const m = require("./public/openrocket-version.json");
            console.log(`- OpenRocket release: **${m.version}** (${m.asset})`);
            console.log(`- JAR size: **${(m.bytes / 1e6).toFixed(1)} MB**`);
            console.log(`- sha256: \`${m.sha256}\``);
            console.log(`- Fetched: ${m.fetchedAt}`);
            '
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy to Firebase Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.firebase.outputs.credentials }}
          # Optional override. When empty the CLI uses .firebaserc, so a key that
          # belongs to a different Google Cloud project cannot retarget the deploy.
          PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          args=(--only hosting --non-interactive)
          if [ -n "$PROJECT_ID" ]; then
            args+=(--project "$PROJECT_ID")
          fi
          echo "Target project: ${PROJECT_ID:-$(node -p 'JSON.parse(require("fs").readFileSync(".firebaserc", "utf8")).projects.default')}"
          npx --yes firebase-tools@latest deploy "${args[@]}"
